<!-- 
FILE NAME: dashboard.html
FILE PATH: frontend/dashboard.html
PURPOSE: Operational dashboard rendering analytics and risk distribution charts.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy Risk Dashboard | SM-PRAF</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans">
    <nav class="bg-gray-800 border-b border-gray-700 p-4">
        <div class="container mx-auto flex justify-between items-center">
            <span class="font-bold text-xl text-indigo-400">🛡️ SM-PRAF Dashboard</span>
            <a href="assessment.html" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded text-sm font-semibold transition">Start Assessment</a>
        </div>
    </nav>

    <div class="container mx-auto p-6">
        <header class="mb-8">
            <h1 class="text-3xl font-extrabold">Executive Privacy & Risk Overview</h1>
            <p class="text-gray-400 mt-1">Aggregated telemetry and exposure distribution across synthetic profiles.</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-gray-800 p-6 rounded-lg border border-gray-700 shadow">
                <h3 class="text-gray-400 text-sm uppercase tracking-wider">Total Assessments</h3>
                <p id="total-assessments" class="text-3xl font-bold text-indigo-400 mt-2">--</p>
            </div>
            <div class="bg-gray-800 p-6 rounded-lg border border-gray-700 shadow">
                <h3 class="text-gray-400 text-sm uppercase tracking-wider">Average Risk Score</h3>
                <p id="avg-score" class="text-3xl font-bold text-yellow-400 mt-2">-- / 100</p>
            </div>
            <div class="bg-gray-800 p-6 rounded-lg border border-gray-700 shadow">
                <h3 class="text-gray-400 text-sm uppercase tracking-wider">Framework Status</h3>
                <p class="text-3xl font-bold text-green-400 mt-2">ONLINE</p>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="bg-gray-800 p-6 rounded-lg border border-gray-700">
                <h3 class="text-xl font-semibold mb-4">Risk Level Distribution</h3>
                <canvas id="riskDistChart"></canvas>
            </div>
            <div class="bg-gray-800 p-6 rounded-lg border border-gray-700">
                <h3 class="text-xl font-semibold mb-4">Category Exposure Radar</h3>
                <canvas id="categoryRadarChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        async function fetchDashboardStats() {
            try {
                const res = await fetch('http://localhost:8000/api/dashboard/stats');
                const data = await res.json();
                document.getElementById('total-assessments').innerText = data.total_assessments;
                document.getElementById('avg-score').innerText = data.average_risk_score + " / 100";
                
                const ctx = document.getElementById('riskDistChart').getContext('2d');
                new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: Object.keys(data.risk_distribution),
                        datasets: [{
                            data: Object.values(data.risk_distribution),
                            backgroundColor: ['#10B981', '#F59E0B', '#EF4444', '#7C2D12']
                        }]
                    },
                    options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { color: '#fff' } } } }
                });
            } catch (err) {
                console.error("Failed to load dashboard stats", err);
            }
        }

        const radarCtx = document.getElementById('categoryRadarChart').getContext('2d');
        new Chart(radarCtx, {
            type: 'radar',
            data: {
                labels: ['Profile', 'PII', 'Location', 'Content', 'Connections', 'Tagging', 'Security', 'Apps', 'Social Eng.', 'Footprint'],
                datasets: [{
                    label: 'Average Category Exposure',
                    data: [65, 80, 70, 45, 55, 60, 75, 40, 85, 50],
                    backgroundColor: 'rgba(99, 102, 241, 0.2)',
                    borderColor: 'rgba(99, 102, 241, 1)',
                    pointBackgroundColor: 'rgba(99, 102, 241, 1)'
                }]
            },
            options: { scales: { r: { grid: { color: '#374151' }, ticks: { color: '#9CA3AF' }, pointLabels: { color: '#FFF' } } } }
        });

        fetchDashboardStats();
    </script>
</body>
</html>
